services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: nous-llama
    restart: unless-stopped
    mem_limit: 5g
    cpus: 2.0
    pids_limit: 128
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./models:/models:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    command:
      - -m
      - /models/${LLAMA_MODEL_FILE}
      - -c
      - "1024"
      - -np
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
